name: Artifacts MMOG CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: artifacts-mmog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Artifacts MMOG CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17"
          otp-version: "27"

      - name: Cache Mix deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-artifacts-mmog-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-artifacts-mmog-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (builds taskweft C++ NIF)
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run tests
        run: mix test --trace

      - name: Start a single-node FoundationDB
        run: |
          curl -fsSLO https://github.com/apple/foundationdb/releases/download/7.3.63/foundationdb-clients_7.3.63-1_amd64.deb
          curl -fsSLO https://github.com/apple/foundationdb/releases/download/7.3.63/foundationdb-server_7.3.63-1_amd64.deb
          sudo dpkg -i foundationdb-clients_7.3.63-1_amd64.deb foundationdb-server_7.3.63-1_amd64.deb
          timeout 120 bash -c 'until fdbcli --exec "status minimal" --timeout 5 | grep -q "available"; do sleep 2; done'

      - name: Check out datasource-store at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: V-Sekai-fire/datasource-store
          ref: bf5d552f5dee0fc871b474c5362ad782a49e89c7
          path: datasource-store

      - name: Build the weftfdb extension
        working-directory: datasource-store
        run: |
          sudo apt-get install -y -q cmake libsqlite3-dev
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target weftfdb
          ls -la build/weftfdb.so

      - name: Run the blackboard tests on SQLite over FoundationDB
        env:
          ARTIFACTS_MMOG_WEFTFDB_EXTENSION: ${{ github.workspace }}/datasource-store/build/weftfdb
          ARTIFACTS_MMOG_TEST_DATABASE: "file:mmog_test.v1?vfs=weft_fdb"
          WEFT_FDB_CLUSTER_FILE: /etc/foundationdb/fdb.cluster
        run: mix test --trace test/artifacts_mmog/blackboard_test.exs
